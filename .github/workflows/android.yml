name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, stage3-website-apk]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm build
      - name: Create Android project
        run: pnpm exec cap add android
      - name: Copy web bundle
        run: pnpm exec cap copy android
      - name: Add Android media permissions
        run: node scripts/prepare-android-manifest.mjs
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
